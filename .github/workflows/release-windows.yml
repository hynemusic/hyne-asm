# Builds and publishes a Windows release from the tagged commit, on GitHub's own machine.
# Push a tag like win-v1.2.3. Mac releases (tags vX.Y.Z) are separate and untouched by this workflow.
# A Windows release is never marked "latest", so the README's Mac download link keeps pointing at the Mac app.
name: Release (Windows)

on:
  push:
    tags: ['win-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. win-v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        shell: bash
        run: echo "$TAG" | grep -Eq '^win-v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Tag '$TAG' is not win-vX.Y.Z"; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: |
          dotnet test windows/HyneAsm.sln
          python -m unittest discover -s bridge/tests

      - name: Build
        shell: bash
        run: |
          VERSION="${TAG#win-v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Under 1 MB: it uses the .NET Desktop Runtime, which the installer adds when it's missing.
          dotnet publish windows/HyneAsm.App/HyneAsm.App.csproj -c Release -r win-x64 --self-contained false \
            -p:PublishSingleFile=true -p:HM_VERSION="$VERSION" -o publish

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=$env:VERSION" windows/installer/HyneAsm.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = "HYNE-ASM-Windows-Setup-$env:VERSION.exe"
          Move-Item "dist/$setup" $setup
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() + "  $setup" | Out-File -Encoding ascii "$setup.sha256"

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "HYNE-ASM-Windows-Setup-$VERSION.exe" "HYNE-ASM-Windows-Setup-$VERSION.exe.sha256" \
            --title "HYNE ASM for Windows $VERSION" --latest=false \
            --notes "Windows version. Download HYNE-ASM-Windows-Setup-$VERSION.exe, start it and click Install. If Microsoft's .NET Desktop Runtime is missing, the setup downloads and installs it (Windows asks once for admin rights). The first time, Windows may show \"Windows protected your PC\": click More info → Run anyway. To update, run the new setup."

      # The README's Windows links point at one release (GitHub's "latest" link is the Mac app's): move them to this one.
      - name: Point the README at this release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          sed -i -E "s#releases/tag/win-v[0-9]+\.[0-9]+\.[0-9]+#releases/tag/$TAG#g" README.md
          if git diff --quiet; then echo "README already points at $TAG"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "docs: Windows download links point at $TAG"
          git push origin main
